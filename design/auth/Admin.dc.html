<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Plus+Jakarta+Sans:wght@200..800&display=swap">
  <style>
    body { margin: 0; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
    a { color: #085E41; text-decoration: none; }
    a:hover { color: #16A260; }
    .lora { font-family: 'Lora', Georgia, serif; }
  </style>
</helmet>

<!-- Connexion à l'administration.
     Elle ne s'adresse pas au même public et ne doit pas ressembler à la porte des
     étudiants : pas de panneau d'accueil, pas d'invitation à créer un compte, rien qui
     laisse croire qu'on peut s'y inscrire. Sobre, étroite, et sur fond sombre — la même
     encre que la note de veille du site, jamais une couleur nouvelle. -->
<div style="width: 1440px; height: 760px; background: #0F172A; color: #E2E8F0; display: grid; place-items: center;">
  <div style="width: 380px;">

    <div style="display: flex; align-items: center; gap: 11px; margin-bottom: 40px;">
      <span style="width: 36px; height: 36px; border-radius: 8px; border: 1px solid #334155; display: grid; place-items: center;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#94A3B8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3l8 4v5c0 5-3.4 8.3-8 9-4.6-.7-8-4-8-9V7l8-4z"></path>
        </svg>
      </span>
      <span>
        <span style="display: block; font-size: 14px; font-weight: 700; color: #FFFFFF; line-height: 1.2;">Administration</span>
        <span style="display: block; font-size: 10px; letter-spacing: 0.14em; color: #64748B;">LOUISFARM</span>
      </span>
    </div>

    <h1 class="lora" style="font-size: 26px; font-weight: 600; color: #FFFFFF; margin: 0 0 8px;">Connexion</h1>
    <p style="font-size: 13px; color: #64748B; margin: 0 0 30px; line-height: 1.6;">
      Accès réservé. Les comptes sont créés à la main&nbsp;; il n'y a pas d'inscription.
    </p>

    <div style="display: flex; flex-direction: column; gap: 18px;">
      <div>
        <label style="display: block; font-size: 13px; font-weight: 600; color: #CBD5E1; margin-bottom: 7px;">Identifiant</label>
        <input placeholder="Nom d'utilisateur"
          style="width: 100%; box-sizing: border-box; height: 46px; padding: 0 14px; border: 1px solid #334155; border-radius: 8px; background: #1E293B; font-size: 14px; font-family: inherit; color: #F1F5F9;">
      </div>
      <div>
        <label style="display: block; font-size: 13px; font-weight: 600; color: #CBD5E1; margin-bottom: 7px;">Mot de passe</label>
        <input type="password" placeholder="••••••••"
          style="width: 100%; box-sizing: border-box; height: 46px; padding: 0 14px; border: 1px solid #334155; border-radius: 8px; background: #1E293B; font-size: 14px; font-family: inherit; color: #F1F5F9;">
      </div>
      <button style="width: 100%; height: 48px; margin-top: 6px; border: 0; border-radius: 8px; background: #085E41; color: #FFFFFF; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer;">
        Se connecter
      </button>
    </div>

    <!-- L'erreur d'identifiants, montrée dans son état réel : un seul message pour les
         deux champs, sans dire lequel est faux. -->
    <div style="margin-top: 20px; display: flex; gap: 10px; align-items: flex-start; padding: 13px 15px; border: 1px solid #7F1D1D; border-radius: 8px; background: #450A0A;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FCA5A5" stroke-width="1.8" stroke-linecap="round" style="flex-shrink: 0; margin-top: 1px;">
        <circle cx="12" cy="12" r="9"></circle><path d="M12 8v5M12 16.5v.01"></path>
      </svg>
      <span style="font-size: 13px; color: #FCA5A5; line-height: 1.5;">Identifiant ou mot de passe incorrect.</span>
    </div>

    <p style="font-size: 12px; color: #475569; margin: 32px 0 0; text-align: center;">
      <a href="#" style="color: #64748B;">Retour au site</a>
    </p>
  </div>
</div>
</x-dc>
</body>
</html>
