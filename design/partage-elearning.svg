<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"
     font-family="DejaVu Sans">
  <!--
    Vignette de partage de la formation (Open Graph, 1200 × 630).

    Elle est lue en tout petit dans une conversation WhatsApp : c'est ce qui commande la
    composition. Peu de mots, très gros, et trois blocs dont la couleur suffit à distinguer
    les parcours même quand le texte devient illisible. Les couleurs sont celles déclarées
    dans shared/programs.ts, pour qu'on retrouve la même chose en arrivant sur le site.

    Elle annonçait auparavant le seul cursus MEAL et ses trois outils — KoboCollect, QGIS,
    Python. LouisFarm délivre depuis trois certificats distincts : partager le lien faisait
    la promotion d'un tiers de l'offre, et les deux parcours les plus récents restaient
    invisibles au moment précis où le lien circule dans un groupe.

    La composition a été mise au point dans Canva (design « Professional digital card
    design for LouisFarm Learning ») puis reportée ici, parce que c'est ce fichier que le
    build lit : le PNG est régénéré depuis ce SVG, jamais retouché à la main.
  -->
  <defs>
    <linearGradient id="fond" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08281c"/>
      <stop offset="1" stop-color="#124a34"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5ce6a2" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#5ce6a2" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#fond)"/>
  <circle cx="1010" cy="260" r="330" fill="url(#halo)"/>

  <!-- ── Marque ── -->
  <g transform="translate(70,64)">
    <rect width="46" height="46" rx="14" fill="#5ce6a2"/>
    <path d="M12 32 C12 18, 22 11, 34 12 C34 24, 25 33, 12 32 Z" fill="#08281c"/>
    <path d="M12 34 C18 27, 25 22, 32 19" stroke="#08281c" stroke-width="2.4"
          stroke-linecap="round" fill="none"/>
    <text x="60" y="24" font-size="27" font-weight="bold" fill="#ffffff">LouisFarm</text>
    <!-- La pastille démarre à x=244 : « LouisFarm » en DejaVu Sans Bold 27 court jusqu'à
         x≈228, et une version précédente la posait à 205, donc par-dessus le mot. -->
    <rect x="244" y="5" width="120" height="28" rx="8" fill="#ffffff" fill-opacity="0.16"/>
    <text x="257" y="25" font-size="15" font-weight="bold" fill="#5ce6a2"
          letter-spacing="1.5">LEARNING</text>
  </g>

  <!-- ── Accroche ──
       Sur deux lignes plutôt qu'une : « Trois parcours certifiants » d'un seul tenant
       imposerait un corps de 44, deux fois plus petit, illisible en vignette. -->
  <text x="70" y="222" font-size="66" font-weight="bold" fill="#ffffff">Trois parcours</text>
  <text x="70" y="300" font-size="66" font-weight="bold" fill="#5ce6a2">certifiants</text>

  <text x="70" y="352" font-size="26" fill="#ffffff" fill-opacity="0.72">100 % gratuits · Afrique de l'Ouest</text>

  <!-- ── Les trois parcours ──
       Trois blocs de 340 séparés de 20 : 3×340 + 2×20 = 1060, soit exactement la largeur
       utile entre les marges de 70. -->
  <g transform="translate(70,412)">
    <g>
      <rect width="340" height="92" rx="16" fill="#0d9488"/>
      <text x="18" y="38" font-size="19" font-weight="bold" fill="#ffffff">Cursus MEAL</text>
      <text x="18" y="66" font-size="15" fill="#ffffff" fill-opacity="0.82">Collecte, analyse, cartographie</text>
    </g>
    <g transform="translate(360,0)">
      <rect width="340" height="92" rx="16" fill="#7c3aed"/>
      <text x="18" y="38" font-size="19" font-weight="bold" fill="#ffffff">Formation de formateurs</text>
      <text x="18" y="66" font-size="15" fill="#ffffff" fill-opacity="0.82">Gestion financière paysanne</text>
    </g>
    <g transform="translate(720,0)">
      <rect width="340" height="92" rx="16" fill="#b45309"/>
      <text x="18" y="38" font-size="19" font-weight="bold" fill="#ffffff">Finance climatique agricole</text>
      <text x="18" y="66" font-size="15" fill="#ffffff" fill-opacity="0.82">Risque climatique et crédit</text>
    </g>
  </g>

  <!-- ── Pied : adresse et condition d'entrée ── -->
  <text x="70" y="562" font-size="25" font-weight="bold" fill="#ffffff">louisfarm.com/elearning</text>
  <text x="70" y="596" font-size="19" fill="#ffffff" fill-opacity="0.55">Admission sur test · Inscription ouverte en permanence</text>

  <!-- ── Objet de droite : la toque, lisible même en vignette.
       Remontée à y=104 : les blocs de parcours descendent maintenant jusqu'à y=504, et
       l'ancienne position (196) la faisait mordre sur le troisième bloc. -->
  <g transform="translate(880,104)">
    <circle cx="130" cy="130" r="130" fill="#ffffff" fill-opacity="0.07"/>
    <g transform="translate(28,44)">
      <path d="M102 0 L204 44 L102 88 L0 44 Z" fill="#5ce6a2"/>
      <path d="M102 88 L0 44 L0 62 L102 106 L204 62 L204 44 Z" fill="#3fcf8a"/>
      <path d="M44 74 L44 128 C44 146, 160 146, 160 128 L160 74 L102 100 Z" fill="#ffffff"/>
      <path d="M196 52 L196 120" stroke="#5ce6a2" stroke-width="6" stroke-linecap="round"/>
      <circle cx="196" cy="128" r="11" fill="#5ce6a2"/>
    </g>
  </g>
</svg>
