<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1620" viewBox="0 0 1080 1620" font-family="DejaVu Sans">
  <defs>
    <linearGradient id="hd" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0d9488" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1080" height="1620" fill="#eef2f1"/>

  <!-- ══ En-tête ══ -->
  <rect width="1080" height="340" fill="url(#hd)"/>
  <rect x="60" y="52" width="424" height="52" rx="26" fill="#ffffff" fill-opacity="0.18"/>
  <circle cx="94" cy="78" r="13" fill="#ffffff"/>
  <text x="120" y="87" font-size="23" font-weight="bold" fill="#ffffff" letter-spacing="1.5">DATAMEAL ACADEMY</text>
  <text x="60" y="185" font-size="62" font-weight="bold" fill="#ffffff">Comment s'inscrire</text>
  <text x="60" y="240" font-size="29" fill="#ffffff" fill-opacity="0.9">Formation gratuite par projets — MEAL, KoboCollect,</text>
  <text x="60" y="280" font-size="29" fill="#ffffff" fill-opacity="0.9">QGIS et Python. Afrique de l'Ouest.</text>

  <!-- ══ Étape 1 ══ -->
  <rect x="60" y="392" width="960" height="196" rx="26" fill="#ffffff" filter="url(#sh)"/>
  <circle cx="146" cy="452" r="38" fill="#0d9488"/>
  <text x="146" y="466" font-size="38" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="212" y="447" font-size="35" font-weight="bold" fill="#0f172a">Créez votre compte</text>
  <text x="212" y="492" font-size="25" fill="#475569">Prénom, nom, e-mail et mot de passe (8 caractères min.).</text>
  <rect x="212" y="516" width="656" height="50" rx="12" fill="#f0fdfa" stroke="#5eead4" stroke-dasharray="6 4"/>
  <text x="236" y="548" font-size="25" font-weight="bold" fill="#0d9488" font-family="DejaVu Sans Mono">louisfarm.com/academy/register</text>

  <!-- ══ Étape 2 ══ -->
  <rect x="60" y="612" width="960" height="196" rx="26" fill="#ffffff" filter="url(#sh)"/>
  <circle cx="146" cy="672" r="38" fill="#0d9488"/>
  <text x="146" y="686" font-size="38" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="212" y="667" font-size="35" font-weight="bold" fill="#0f172a">Confirmez votre e-mail</text>
  <text x="212" y="712" font-size="26" fill="#475569">Vous recevez un code à 6 chiffres. Saisissez-le, ou cliquez</text>
  <text x="212" y="748" font-size="26" fill="#475569">sur le lien du message.</text>
  <text x="212" y="784" font-size="23" fill="#0d9488" font-weight="bold">Indispensable pour recevoir vos attestations.</text>

  <!-- ══ Étape 3 ══ -->
  <rect x="60" y="832" width="960" height="196" rx="26" fill="#ffffff" filter="url(#sh)"/>
  <circle cx="146" cy="892" r="38" fill="#0d9488"/>
  <text x="146" y="906" font-size="38" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <text x="212" y="887" font-size="35" font-weight="bold" fill="#0f172a">Passez le test d'admission</text>
  <text x="212" y="932" font-size="25" fill="#475569">30 questions à choix multiples, en ligne. Repassable si échec.</text>
  <rect x="212" y="956" width="392" height="52" rx="12" fill="#ccfbf1"/>
  <text x="236" y="990" font-size="26" font-weight="bold" fill="#0d9488">21 / 30 pour être admis</text>

  <!-- ══ Étape 4 ══ -->
  <rect x="60" y="1052" width="960" height="196" rx="26" fill="#ffffff" filter="url(#sh)"/>
  <circle cx="146" cy="1112" r="38" fill="#0d9488"/>
  <text x="146" y="1126" font-size="38" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  <text x="212" y="1107" font-size="35" font-weight="bold" fill="#0f172a">Suivez votre planning</text>
  <text x="212" y="1152" font-size="26" fill="#475569">Vos leçons s'ouvrent semaine après semaine. Vous pouvez</text>
  <text x="212" y="1188" font-size="26" fill="#475569">prendre de l'avance ; une leçon en retard reste rattrapable.</text>
  <text x="212" y="1224" font-size="23" fill="#0d9488" font-weight="bold">Accès valable 3 mois après l'admission.</text>

  <!-- ══ Étape 5 ══ -->
  <rect x="60" y="1272" width="960" height="196" rx="26" fill="#ffffff" filter="url(#sh)"/>
  <circle cx="146" cy="1332" r="38" fill="#0d9488"/>
  <text x="146" y="1346" font-size="38" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
  <text x="212" y="1327" font-size="35" font-weight="bold" fill="#0f172a">Validez chaque leçon</text>
  <text x="212" y="1372" font-size="26" fill="#475569">Chaque leçon finit par des exercices pratiques, corrigés</text>
  <text x="212" y="1408" font-size="26" fill="#475569">automatiquement.</text>
  <rect x="212" y="1428" width="270" height="26" rx="0" fill="none"/>
  <text x="212" y="1448" font-size="23" fill="#0d9488" font-weight="bold">70 % de bonnes réponses pour valider.</text>

  <!-- ══ Pied ══ -->
  <text x="540" y="1528" font-size="28" fill="#64748b" text-anchor="middle">Formation 100 % gratuite et en ligne</text>
  <text x="540" y="1578" font-size="34" font-weight="bold" fill="#0d9488" text-anchor="middle">louisfarm.com/academy/register</text>
</svg>
