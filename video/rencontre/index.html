      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #07211c; }
      body { font-family: 'Jakarta', 'DejaVu Sans', sans-serif; color: #eef7f4; }

      /* Fond : un vert sapin très sombre, réchauffé par deux halos émeraude. Des dégradés
         radiaux et non un flou : le flou est rastérisé à chaque image, le dégradé se peint
         une fois. */
      .fond { position: absolute; inset: 0; background: #07211c; }
      .halo { position: absolute; border-radius: 9999px; }
      .halo-a { width: 1100px; height: 1100px; left: -220px; top: -320px;
                background: radial-gradient(closest-side, rgba(13,148,136,0.30), transparent 70%); }
      .halo-b { width: 900px; height: 900px; right: -180px; bottom: -300px;
                background: radial-gradient(closest-side, rgba(20,184,166,0.20), transparent 70%); }
      .grain { position: absolute; inset: 0; opacity: 0.35;
               background: radial-gradient(ellipse at 50% 45%, transparent 40%, rgba(0,0,0,0.55) 100%); }

      .scene { position: absolute; inset: 0; display: grid; place-items: center; }
      .centre { width: 1360px; text-align: center; }

      .surtitre { font-weight: 700; font-size: 26px; letter-spacing: 0.42em;
                  color: rgba(178,225,216,0.85); text-transform: uppercase; }
      .trait { height: 2px; background: linear-gradient(90deg, transparent, #14b8a6, transparent);
               margin: 34px auto 0; width: 620px; transform-origin: 50% 50%; }

      .titre { font-family: 'Lora', 'DejaVu Serif', serif; font-weight: 600;
               font-size: 128px; line-height: 1.04; letter-spacing: -0.025em; }
      .sous { font-size: 32px; color: rgba(178,225,216,0.9); margin-top: 30px; letter-spacing: 0.02em; }

      /* `max-content` et non une largeur fixe : à 1180 px le bloc était plus large que son
         texte, donc centré comme boîte mais déporté à gauche comme image. Le bloc épouse
         désormais la plus longue des trois lignes, et le groupe tombe au centre optique. */
      .reperes { display: grid; gap: 40px; width: max-content; margin: 0 auto; text-align: left; }
      .repere { display: grid; grid-template-columns: 84px auto; align-items: center; }
      .puce { width: 56px; height: 56px; border-radius: 18px; background: rgba(20,184,166,0.16);
              display: grid; place-items: center; }
      .puce span { width: 18px; height: 18px; border-radius: 6px; background: #14b8a6; display: block; }
      .repere p { font-size: 44px; font-weight: 400; color: #dff1ec; }

      .carte { display: grid; gap: 14px; }
      .nom { font-family: 'Lora', 'DejaVu Serif', serif; font-weight: 600; font-size: 92px;
             letter-spacing: -0.02em; }
      .role { font-size: 30px; color: rgba(178,225,216,0.9); }
      .site { font-size: 28px; letter-spacing: 0.16em; color: #14b8a6; margin-top: 26px;
              text-transform: uppercase; font-weight: 700; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="15"
         data-width="1920" data-height="1080">

      <div class="fond"></div>
      <div class="halo halo-a" id="haloA"></div>
      <div class="halo halo-b" id="haloB"></div>
      <div class="grain"></div>

      <!-- 1. Le logotype -->
      <div class="clip scene" id="s1" data-start="0" data-duration="3.2" data-track-index="1">
        <div class="centre">
          <div class="surtitre" id="marque">LOUISFARM&nbsp;&nbsp;LEARNING</div>
          <div class="trait" id="trait"></div>
        </div>
      </div>

      <!-- 2. Le titre -->
      <div class="clip scene" id="s2" data-start="3.2" data-duration="3.8" data-track-index="2">
        <div class="centre">
          <div class="titre" id="titre">La rencontre commence</div>
          <div class="sous" id="sous">Séance en direct · Cursus MEAL</div>
        </div>
      </div>

      <!-- 3. Les trois repères -->
      <div class="clip scene" id="s3" data-start="7.0" data-duration="4.4" data-track-index="3">
        <div class="reperes">
          <div class="repere r"><div class="puce"><span></span></div><p>Caméra et micro restent à votre main</p></div>
          <div class="repere r"><div class="puce"><span></span></div><p>Le support est projeté par le formateur</p></div>
          <div class="repere r"><div class="puce"><span></span></div><p>Vos questions dans le fil de discussion</p></div>
        </div>
      </div>

      <!-- 4. La carte finale -->
      <div class="clip scene" id="s4" data-start="11.4" data-duration="3.6" data-track-index="4">
        <div class="centre carte">
          <div class="nom" id="nom">Louis TATCHIDA</div>
          <div class="role" id="role">Agronome &amp; Expert en Finance Agricole</div>
          <div class="site" id="site">louisfarm.com</div>
        </div>
      </div>
    </div>

    <script>
      // Une seule timeline, en pause, enregistrée après construction — c'est le contrat.
      // Les états initiaux sont posés par `fromTo` et jamais par une transformation CSS :
      // les deux se disputeraient la même propriété.
      const E = "power3.out";
      const tl = gsap.timeline({ paused: true });

      // Dérive lente des halos sur toute la durée : le fond n'est jamais tout à fait immobile,
      // sans que rien ne bouge assez pour se remarquer.
      tl.fromTo("#haloA", { x: -40, y: -20 }, { x: 40, y: 30, duration: 15, ease: "none" }, 0)
        .fromTo("#haloB", { x: 30, y: 20 }, { x: -30, y: -20, duration: 15, ease: "none" }, 0);

      // 1. Le logotype s'installe, le trait se tire depuis le centre.
      tl.fromTo("#marque", { autoAlpha: 0, y: 26 },
                           { autoAlpha: 1, y: 0, duration: 1.2, ease: E }, 0.25)
        .fromTo("#trait", { scaleX: 0, autoAlpha: 0 },
                          { scaleX: 1, autoAlpha: 1, duration: 1.0, ease: E }, 0.75)
        .to(["#marque", "#trait"], { autoAlpha: 0, y: -28, duration: 0.6, ease: "power2.in" }, 2.6)
        .set(["#marque", "#trait"], { autoAlpha: 0 }, 3.2);

      // 2. Le titre.
      tl.fromTo("#titre", { autoAlpha: 0, y: 42 }, { autoAlpha: 1, y: 0, duration: 1.0, ease: E }, 3.45)
        .fromTo("#sous", { autoAlpha: 0, y: 22 }, { autoAlpha: 1, y: 0, duration: 0.8, ease: E }, 3.85)
        .to(["#titre", "#sous"], { autoAlpha: 0, y: -26, duration: 0.55, ease: "power2.in" }, 6.4)
        .set(["#titre", "#sous"], { autoAlpha: 0 }, 7.0);

      // 3. Les trois repères, l'un après l'autre.
      tl.fromTo(".r", { autoAlpha: 0, x: -44 },
                      { autoAlpha: 1, x: 0, duration: 0.75, stagger: 0.42, ease: E }, 7.25)
        .to(".r", { autoAlpha: 0, y: -20, duration: 0.5, stagger: 0.08, ease: "power2.in" }, 10.7)
        .set(".r", { autoAlpha: 0 }, 11.4);

      // 4. La carte finale, qui reste sur la dernière image.
      tl.fromTo("#nom", { autoAlpha: 0, y: 34 }, { autoAlpha: 1, y: 0, duration: 0.9, ease: E }, 11.65)
        .fromTo("#role", { autoAlpha: 0, y: 22 }, { autoAlpha: 1, y: 0, duration: 0.8, ease: E }, 11.95)
        .fromTo("#site", { autoAlpha: 0, y: 18 }, { autoAlpha: 1, y: 0, duration: 0.8, ease: E }, 12.35);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
