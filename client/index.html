    <!-- Les deux polices du site, et elles seules.
         Il y en avait VINGT-QUATRE ici — Architects Daughter, DM Sans, Fira Code, Geist,
         IBM Plex, Inter, JetBrains Mono, Merriweather, Montserrat, Poppins, Roboto… — la
         plupart en variable avec italiques, dans une feuille bloquant le premier rendu de
         chaque page. Aucune n'était employée : la seule occurrence d'« Inter » dans le code
         était IntersectionObserver. Vestige d'un thème de départ.

         Ce lien remplace aussi l'@import qui ouvrait index.css : un @import dans une feuille
         de style impose une cascade — télécharger le CSS, l'analyser, PUIS demander les
         polices. Depuis le <head>, la requête part tout de suite, en parallèle du reste. -->
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
