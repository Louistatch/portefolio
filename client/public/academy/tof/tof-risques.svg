<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="system-ui, sans-serif">
  <rect width="800" height="460" fill="#ffffff"/>
  <text x="30" y="48" font-size="20" font-weight="700" fill="#5b21b6">La carte des risques du village</text>
  <text x="30" y="72" font-size="13" fill="#64748b">Un risque se gère deux fois : avant (le prévenir) et après (le traverser sans tout perdre).</text>
  <!-- tableau des risques -->
  <g>
    <rect x="40" y="100" width="460" height="330" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <rect x="40" y="100" width="460" height="42" rx="12" fill="#5b21b6"/>
    <rect x="40" y="128" width="460" height="14" fill="#5b21b6"/>
    <g font-size="12" font-weight="700" fill="#ffffff">
      <text x="56" y="127">Risque</text>
      <text x="240" y="127">Avant (prévenir)</text>
      <text x="390" y="127">Après (amortir)</text>
    </g>
    <g font-size="12" fill="#334155">
      <text x="56" y="170" font-weight="700">Sécheresse</text>
      <text x="240" y="170">variété courte, semis décalé</text>
      <text x="390" y="170">épargne, assurance indicielle</text>
      <line x1="56" y1="182" x2="484" y2="182" stroke="#f1f5f9"/>
      <text x="56" y="210" font-weight="700">Maladie du bétail</text>
      <text x="240" y="210">vaccination, hygiène</text>
      <text x="390" y="210">isoler, vendre tôt</text>
      <line x1="56" y1="222" x2="484" y2="222" stroke="#f1f5f9"/>
      <text x="56" y="250" font-weight="700">Vol</text>
      <text x="240" y="250">grenier commun, marquage</text>
      <text x="390" y="250">déclarer, solidarité locale</text>
      <line x1="56" y1="262" x2="484" y2="262" stroke="#f1f5f9"/>
      <text x="56" y="290" font-weight="700">Prix qui s'effondrent</text>
      <text x="240" y="290">vendre en plusieurs fois</text>
      <text x="390" y="290">stockage, warrantage</text>
      <line x1="56" y1="302" x2="484" y2="302" stroke="#f1f5f9"/>
      <text x="56" y="330" font-weight="700">Maladie d'un membre</text>
      <text x="240" y="330">prévention, mutuelle</text>
      <text x="390" y="330">tontine de solidarité</text>
      <line x1="56" y1="342" x2="484" y2="342" stroke="#f1f5f9"/>
      <text x="56" y="370" font-weight="700">Décès / deuil</text>
      <text x="240" y="370">—</text>
      <text x="390" y="370">caisse villageoise, groupe</text>
    </g>
  </g>
  <!-- méthode -->
  <g>
    <rect x="530" y="100" width="240" height="200" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="546" y="130" font-size="13" font-weight="700" fill="#134e4a">Animation (45 min)</text>
    <g font-size="12" fill="#475569">
      <text x="546" y="158">1. Chacun écrit 3 risques</text>
      <text x="546" y="182">   vécus ces 5 dernières années.</text>
      <text x="546" y="210">2. On les classe : fréquence ×</text>
      <text x="546" y="234">   gravité (rare/gros, fréquent/</text>
      <text x="546" y="258">   petit…).</text>
      <text x="546" y="286">3. Pour les 3 premiers :</text>
      <text x="546" y="310">   « que fait-on AVANT ? »</text>
      <text x="546" y="334">   « que fait-on APRÈS ? »</text>
    </g>
  </g>
  <g>
    <rect x="530" y="320" width="240" height="110" rx="12" fill="#ecfdf5" stroke="#a7f3d0"/>
    <text x="546" y="348" font-size="13" font-weight="700" fill="#047857">À retenir</text>
    <text x="546" y="372" fill="#047857">Un ménage qui a prévu ses risques</text>
    <text x="546" y="392" fill="#047857">ne vend pas sa récolte en panique</text>
    <text x="546" y="412" fill="#047857">ni son bétail à perte.</text>
  </g>
</svg>
