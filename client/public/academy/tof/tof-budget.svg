<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="system-ui, sans-serif">
  <rect width="800" height="460" fill="#ffffff"/>
  <text x="30" y="48" font-size="20" font-weight="700" fill="#5b21b6">Le budget familial : deux colonnes, un équilibre</text>
  <text x="30" y="72" font-size="13" fill="#64748b">Exemple d'une saison au village — à refaire avec les vrais chiffres du groupe.</text>
  <!-- entrées -->
  <g>
    <rect x="40" y="100" width="330" height="260" rx="12" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/>
    <text x="60" y="132" font-size="15" font-weight="700" fill="#047857">Ce qui entre</text>
    <g font-size="13" fill="#334155">
      <rect x="60" y="150" width="210" height="34" rx="6" fill="#ffffff" stroke="#a7f3d0"/>
      <text x="74" y="172">Vente de maïs</text><text x="240" y="172" font-weight="700">120 000 F</text>
      <rect x="60" y="192" width="210" height="34" rx="6" fill="#ffffff" stroke="#a7f3d0"/>
      <text x="74" y="214">Petit élevage</text><text x="240" y="214" font-weight="700">25 000 F</text>
      <rect x="60" y="234" width="210" height="34" rx="6" fill="#ffffff" stroke="#a7f3d0"/>
      <text x="74" y="256">Transfert du fils</text><text x="240" y="256" font-weight="700">15 000 F</text>
      <line x1="60" y1="284" x2="330" y2="284" stroke="#16a34a" stroke-width="2"/>
      <text x="74" y="308" font-weight="700" fill="#047857">Total entrées</text><text x="240" y="308" font-weight="700" fill="#047857">160 000 F</text>
    </g>
  </g>
  <!-- sorties -->
  <g>
    <rect x="430" y="100" width="330" height="260" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
    <text x="450" y="132" font-size="15" font-weight="700" fill="#b91c1c">Ce qui sort</text>
    <g font-size="13" fill="#334155">
      <rect x="450" y="150" width="210" height="34" rx="6" fill="#ffffff" stroke="#fecaca"/>
      <text x="464" y="172">Semences + engrais</text><text x="630" y="172" font-weight="700">35 000 F</text>
      <rect x="450" y="192" width="210" height="34" rx="6" fill="#ffffff" stroke="#fecaca"/>
      <text x="464" y="214">Scolarité des enfants</text><text x="630" y="214" font-weight="700">30 000 F</text>
      <rect x="450" y="234" width="210" height="34" rx="6" fill="#ffffff" stroke="#fecaca"/>
      <text x="464" y="256">Santé</text><text x="630" y="256" font-weight="700">20 000 F</text>
      <rect x="450" y="276" width="210" height="34" rx="6" fill="#ffffff" stroke="#fecaca"/>
      <text x="464" y="298">Cérémonies &amp; imprévus</text><text x="630" y="298" font-weight="700">25 000 F</text>
      <line x1="450" y1="320" x2="720" y2="320" stroke="#dc2626" stroke-width="2"/>
      <text x="464" y="344" font-weight="700" fill="#b91c1c">Total sorties</text><text x="630" y="344" font-weight="700" fill="#b91c1c">110 000 F</text>
    </g>
  </g>
  <!-- solde -->
  <g>
    <rect x="40" y="384" width="720" height="52" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="60" y="416" font-size="14" font-weight="700" fill="#134e4a">Solde : + 50 000 F</text>
    <text x="300" y="416" font-size="12" fill="#475569">→ à décider ENSEMBLE : épargne, investissement, remboursement… avant qu'il ne fonde.</text>
  </g>
</svg>
