<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="system-ui, sans-serif">
  <rect width="800" height="460" fill="#ffffff"/>
  <text x="30" y="48" font-size="20" font-weight="700" fill="#5b21b6">Une campagne, douze mois à financer</text>
  <text x="30" y="72" font-size="13" fill="#64748b">L'argent de la récolte doit tenir jusqu'à la suivante : le calendrier montre où sont les mois creux.</text>
  <!-- frise -->
  <rect x="40" y="120" width="720" height="90" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <g font-size="11" fill="#475569" text-anchor="middle">
    <text x="70" y="110">Jan</text><text x="130" y="110">Fév</text><text x="190" y="110">Mar</text>
    <text x="250" y="110">Avr</text><text x="310" y="110">Mai</text><text x="370" y="110">Juin</text>
    <text x="430" y="110">Juil</text><text x="490" y="110">Août</text><text x="550" y="110">Sep</text>
    <text x="610" y="110">Oct</text><text x="670" y="110">Nov</text><text x="730" y="110">Déc</text>
  </g>
  <g>
    <rect x="40" y="120" width="180" height="90" fill="#fef2f2"/>
    <rect x="220" y="120" width="120" height="90" fill="#fefce8"/>
    <rect x="340" y="120" width="180" height="90" fill="#ecfdf5"/>
    <rect x="520" y="120" width="240" height="90" fill="#fefce8"/>
    <text x="130" y="142" font-size="11" fill="#b91c1c" text-anchor="middle" font-weight="700">SAISON SÈCHE</text>
    <text x="280" y="142" font-size="11" fill="#b45309" text-anchor="middle" font-weight="700">SEMIS</text>
    <text x="430" y="142" font-size="11" fill="#047857" text-anchor="middle" font-weight="700">SAISON DES PLUIES</text>
    <text x="640" y="142" font-size="11" fill="#b45309" text-anchor="middle" font-weight="700">RÉCOLTE &amp; VENTE</text>
    <text x="130" y="164" font-size="10" fill="#475569" text-anchor="middle">préparation des champs</text>
    <text x="130" y="180" font-size="10" fill="#475569" text-anchor="middle">achat intrants</text>
    <text x="280" y="180" font-size="10" fill="#475569" text-anchor="middle">semis · sarclage</text>
    <text x="430" y="180" font-size="10" fill="#475569" text-anchor="middle">entretien · engrais</text>
    <text x="640" y="164" font-size="10" fill="#475569" text-anchor="middle">mois où l'argent RENTRE</text>
    <text x="640" y="180" font-size="10" fill="#475569" text-anchor="middle">novembre-décembre</text>
  </g>
  <!-- courbe de trésorerie -->
  <text x="40" y="262" font-size="13" font-weight="700" fill="#134e4a">La trésorerie du ménage</text>
  <path d="M60 380 L200 350 L280 300 L400 320 L520 340 L640 240 L740 250" fill="none" stroke="#7c3aed" stroke-width="4"/>
  <g fill="#7c3aed">
    <circle cx="60" cy="380" r="5"/><circle cx="280" cy="300" r="5"/><circle cx="640" cy="240" r="5"/><circle cx="740" cy="250" r="5"/>
  </g>
  <text x="66" y="402" font-size="11" fill="#7c3aed">départ :</text>
  <text x="66" y="418" font-size="11" fill="#7c3aed">l'argent</text>
  <text x="66" y="434" font-size="11" fill="#7c3aed">baisse…</text>
  <text x="270" y="286" font-size="11" fill="#b91c1c" font-weight="700">le creux : avril-août</text>
  <text x="596" y="228" font-size="11" fill="#047857" font-weight="700">la vente recharge</text>
  <g font-size="12" fill="#475569">
    <rect x="40" y="330" width="720" height="0" fill="none"/>
    <rect x="330" y="330" width="430" height="110" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="346" y="358" font-weight="700" fill="#134e4a">Question du formateur</text>
    <text x="346" y="380" fill="#475569">« Entre avril et août, de quoi vit le ménage ? »</text>
    <text x="346" y="400" fill="#475569">Réponses attendues : épargne de la récolte, petit élevage,</text>
    <text x="346" y="420" fill="#475569">transferts, crédit… puis : « et si on préparait ce creux ? »</text>
  </g>
</svg>
