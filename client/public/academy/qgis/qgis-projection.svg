<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="system-ui, sans-serif">
  <rect width="800" height="460" fill="#ffffff"/>
  <text x="30" y="52" font-size="20" font-weight="700" fill="#134e4a">La Terre est ronde, la carte est plate</text>
  <text x="30" y="76" font-size="13" fill="#64748b">Toute projection déforme quelque chose : les angles, les surfaces ou les distances. On choisit selon l'usage.</text>
  <!-- sphère -->
  <circle cx="200" cy="220" r="110" fill="#dcfce7" stroke="#134e4a" stroke-width="3"/>
  <path d="M200 110 Q 240 160 200 220 Q 160 270 200 330" fill="none" stroke="#16a34a" stroke-width="2" opacity="0.6"/>
  <path d="M200 110 Q 300 160 310 220 Q 320 280 200 330" fill="none" stroke="#16a34a" stroke-width="2" opacity="0.6"/>
  <ellipse cx="200" cy="220" rx="110" ry="44" fill="none" stroke="#16a34a" stroke-width="2" opacity="0.6"/>
  <circle cx="262" cy="186" r="9" fill="#0d9488"/>
  <text x="252" y="170" font-size="12" fill="#134e4a">village</text>
  <!-- flèche -->
  <path d="M330 220 L470 220" stroke="#d97706" stroke-width="4" fill="none" marker-end="url(#p1)"/>
  <defs><marker id="p1" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/></marker></defs>
  <text x="356" y="208" font-size="12" font-weight="600" fill="#b45309">projection</text>
  <!-- plan -->
  <rect x="500" y="120" width="270" height="200" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="3"/>
  <g stroke="#cbd5e1" stroke-width="1">
    <line x1="500" y1="160" x2="770" y2="160"/><line x1="500" y1="200" x2="770" y2="200"/><line x1="500" y1="240" x2="770" y2="240"/><line x1="500" y1="280" x2="770" y2="280"/>
    <line x1="545" y1="120" x2="545" y2="320"/><line x1="590" y1="120" x2="590" y2="320"/><line x1="635" y1="120" x2="635" y2="320"/><line x1="680" y1="120" x2="680" y2="320"/><line x1="725" y1="120" x2="725" y2="320"/>
  </g>
  <circle cx="662" cy="208" r="9" fill="#0d9488"/>
  <text x="640" y="196" font-size="12" fill="#134e4a">même village</text>
  <text x="508" y="348" font-size="12" fill="#475569">La grille (méridiens / parallèles) devient un quadrillage régulier.</text>
  <!-- rappels -->
  <g font-size="12" fill="#334155">
    <rect x="30" y="368" width="236" height="60" rx="8" fill="#ecfdf5" stroke="#a7f3d0"/>
    <text x="44" y="392" font-weight="700" fill="#047857">EPSG:4326 — WGS 84</text>
    <text x="44" y="412" fill="#047857">Coordonnées GPS en degrés (lat, lon).</text>
    <rect x="290" y="368" width="236" height="60" rx="8" fill="#fefce8" stroke="#fde68a"/>
    <text x="304" y="392" font-weight="700" fill="#b45309">UTM 31N — mètres</text>
    <text x="304" y="412" fill="#b45309">Pour mesurer des distances exactes.</text>
    <rect x="550" y="368" width="220" height="60" rx="8" fill="#f0f9ff" stroke="#bae6fd"/>
    <text x="564" y="392" font-weight="700" fill="#0369a1">Règle pratique</text>
    <text x="564" y="412" fill="#0369a1">GPS → WGS84 · mesures → UTM.</text>
  </g>
</svg>
