<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="system-ui, sans-serif">
  <rect width="800" height="460" fill="#ffffff"/>
  <!-- téléphone KoboCollect -->
  <rect x="70" y="150" width="130" height="230" rx="16" fill="#134e4a"/>
  <rect x="84" y="170" width="102" height="160" rx="6" fill="#f8fafc"/>
  <text x="96" y="200" font-size="12" font-weight="700" fill="#134e4a">KoboCollect</text>
  <rect x="96" y="216" width="78" height="26" rx="5" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="104" y="233" font-size="10" fill="#047857">Enquête 1 ✓</text>
  <rect x="96" y="250" width="78" height="26" rx="5" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="104" y="267" font-size="10" fill="#047857">Enquête 2 ✓</text>
  <rect x="96" y="284" width="78" height="26" rx="5" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="104" y="301" font-size="10" fill="#047857">Enquête 3 ✓</text>
  <text x="135" y="360" font-size="11" fill="#94a3b8">GPS inclus</text>
  <!-- flèche 1 -->
  <path d="M220 260 L300 260" stroke="#0d9488" stroke-width="4" fill="none" marker-end="url(#a1)"/>
  <defs><marker id="a1" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#0d9488"/></marker>
  <marker id="a2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#0d9488"/></marker></defs>
  <text x="228" y="248" font-size="12" fill="#475569">export</text>
  <!-- CSV -->
  <rect x="310" y="180" width="150" height="160" rx="8" fill="#ffffff" stroke="#0d9488" stroke-width="3"/>
  <text x="330" y="210" font-size="14" font-weight="700" fill="#134e4a">enquetes.csv</text>
  <g font-size="10" font-family="monospace" fill="#475569">
    <text x="330" y="234">latitude,longitude,</text>
    <text x="330" y="248">village,puits</text>
    <text x="330" y="268">9.55,1.19,Kara,oui</text>
    <text x="330" y="282">9.63,1.10,Pya,non</text>
    <text x="330" y="296">9.72,1.31,Niamtou,oui</text>
  </g>
  <!-- flèche 2 -->
  <path d="M480 260 L560 260" stroke="#0d9488" stroke-width="4" fill="none" marker-end="url(#a2)"/>
  <text x="488" y="248" font-size="12" fill="#475569">glisser-déposer</text>
  <!-- QGIS -->
  <rect x="580" y="130" width="160" height="260" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <rect x="580" y="130" width="160" height="34" rx="10" fill="#134e4a"/>
  <rect x="580" y="150" width="160" height="14" fill="#134e4a"/>
  <text x="594" y="153" font-size="12" font-weight="600" fill="#ffffff">QGIS</text>
  <rect x="596" y="176" width="128" height="44" rx="6" fill="#fefce8" stroke="#fde68a"/>
  <text x="604" y="192" font-size="10" fill="#334155">enquetes.csv</text>
  <text x="604" y="207" font-size="10" fill="#94a3b8">→ couche de points</text>
  <rect x="596" y="230" width="128" height="44" rx="6" fill="#f0f9ff" stroke="#bae6fd"/>
  <text x="604" y="246" font-size="10" fill="#334155">fond de carte</text>
  <text x="604" y="261" font-size="10" fill="#94a3b8">OpenStreetMap</text>
  <g fill="#0d9488">
    <circle cx="630" cy="320" r="5"/><circle cx="680" cy="300" r="5"/><circle cx="660" cy="350" r="5"/>
  </g>
  <text x="604" y="376" font-size="11" fill="#134e4a">Les enquêtes deviennent</text>
  <text x="604" y="390" font-size="11" fill="#134e4a">des points sur la carte.</text>
</svg>
