<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="system-ui, sans-serif">
  <rect width="800" height="460" fill="#ffffff"/>
  <text x="30" y="48" font-size="20" font-weight="700" fill="#134e4a">Le rapport qui se met à jour tout seul</text>
  <text x="30" y="72" font-size="13" fill="#64748b">Un pipeline : chaque nouvelle collecte déclenche l'analyse et la sortie des livrables.</text>
  <!-- étapes -->
  <g>
    <rect x="40" y="110" width="150" height="90" rx="10" fill="#ecfdf5" stroke="#0d9488" stroke-width="2"/>
    <text x="56" y="140" font-size="13" font-weight="700" fill="#047857">1 · Données Kobo</text>
    <text x="56" y="162" font-size="11" fill="#047857">API du serveur</text>
    <text x="56" y="180" font-size="11" fill="#047857">nouvelles enquêtes</text>
  </g>
  <path d="M200 155 L255 155" stroke="#0d9488" stroke-width="4" fill="none" marker-end="url(#m1)"/>
  <defs><marker id="m1" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#0d9488"/></marker>
  <marker id="m2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#0d9488"/></marker></defs>
  <g>
    <rect x="265" y="110" width="160" height="90" rx="10" fill="#ecfdf5" stroke="#0d9488" stroke-width="2"/>
    <text x="281" y="140" font-size="13" font-weight="700" fill="#047857">2 · Moteur d'analyse</text>
    <text x="281" y="162" font-size="11" fill="#047857">Python : nettoyage,</text>
    <text x="281" y="180" font-size="11" fill="#047857">indicateurs, MUAC…</text>
  </g>
  <path d="M435 155 L490 155" stroke="#0d9488" stroke-width="4" fill="none" marker-end="url(#m2)"/>
  <!-- sorties -->
  <g>
    <rect x="500" y="100" width="260" height="70" rx="10" fill="#f0f9ff" stroke="#0284c7" stroke-width="2"/>
    <text x="516" y="128" font-size="13" font-weight="700" fill="#0369a1">3a · Tableur Excel</text>
    <text x="516" y="150" font-size="11" fill="#0369a1">pour le chargé de programme</text>
    <rect x="500" y="185" width="260" height="70" rx="10" fill="#fefce8" stroke="#d97706" stroke-width="2"/>
    <text x="516" y="213" font-size="13" font-weight="700" fill="#b45309">3b · Cartes QGIS</text>
    <text x="516" y="235" font-size="11" fill="#b45309">par district, par période</text>
    <rect x="500" y="270" width="260" height="70" rx="10" fill="#fdf2f8" stroke="#db2777" stroke-width="2"/>
    <text x="516" y="298" font-size="13" font-weight="700" fill="#be185d">3c · PDF prêt à envoyer</text>
    <text x="516" y="320" font-size="11" fill="#be185d">tableaux + cartes assemblés</text>
  </g>
  <!-- boucle -->
  <path d="M115 200 C 115 340 690 360 640 300" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="300" y="370" font-size="12" fill="#64748b">et tout se rejoue à la prochaine collecte — sans intervention humaine</text>
  <g font-size="12" fill="#475569">
    <rect x="40" y="396" width="720" height="48" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="56" y="416" font-weight="700" fill="#134e4a">Le point qui change tout :</text>
    <text x="256" y="416" fill="#475569">le rapport est un PRODUIT du pipeline, pas un document écrit à la main.</text>
    <text x="56" y="434" fill="#64748b">Quand les données changent, les chiffres du rapport changent — sans risque d'oubli ni de copier-coller.</text>
  </g>
</svg>
